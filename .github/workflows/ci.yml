name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} – Lint & PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite, json, dom
          coverage: none

      - name: PHP syntax check (all plugin files)
        run: |
          find . -name "*.php" -not -path "./node_modules/*" -print0 | xargs -0 -n1 php -l

      - name: Install PHPUnit
        run: |
          curl -sSL -o phpunit.phar https://phar.phpunit.de/phpunit-10.phar
          chmod +x phpunit.phar

      - name: Run test suite
        run: php phpunit.phar -c phpunit.xml.dist
